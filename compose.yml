name: lab05

services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:9090/-/ready]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          CMD-SHELL,
          wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1,
        ]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s

volumes:
  grafana-data:
  prometheus-data:
